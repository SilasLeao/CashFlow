<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - CashFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-container {
            max-width: 400px;
            margin-top: 100px;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="card login-container shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Login</h3>

                <div th:if="${mensagem}" class="alert alert-danger" th:text="${mensagem}"></div>

                <form th:action="@{/auth}" method="post" th:object="${user}" class="form-signin">
                    <div class="mb-3">
                        <label for="login" class="form-label">Usuário</label>
                        <input type="text" th:field="*{login}" class="form-control" id="login"
                            placeholder="Digite seu usuário" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" th:field="*{password}" class="form-control" id="password"
                            placeholder="Digite sua senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>

            </div>
        </div>
    </div>
</body>

</html>
