<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - CashFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-container {
            max-width: 400px;
            margin-top: 100px;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="card login-container shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Login</h3>

                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    Login e/ou senha inválidos!
                </div>
                <div th:if="${param.logout}" class="alert alert-info" role="alert">
                    Você foi desconectado com sucesso.
                </div>
                <div th:if="${param.blocked}" class="alert alert-warning" role="alert">
                    Esta conta de usuário está bloqueada. Entre em contato com o administrador.
                </div>

                <form th:action="@{/perform_login}" method="post" class="form-signin">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Digite seu usuário" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Digite sua senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>

            </div>
        </div>
    </div>
</body>

</html>
