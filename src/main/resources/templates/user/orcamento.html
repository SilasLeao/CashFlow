<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orçamento Anual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:insert="layout/main :: header"></nav>

<div class="container mt-4" th:fragment="content">
    <h2 class="mb-4">Orçamento</h2>

    <!-- Filtro -->
    <form method="get" th:action="@{/orcamento}" class="row g-3 mb-4 align-items-end">
        <div class="col-md-4">
            <label for="accountId" class="form-label">Conta</label>
            <select class="form-select" name="accountId" id="accountId">
                <option value="">Selecione</option>
                <option th:each="conta : ${contas}"
                        th:value="${conta.id}"
                        th:text="${conta.description}">
                </option>
            </select>
        </div>

        <div class="col-md-2">
            <label for="ano" class="form-label">Ano</label>
            <input type="number" id="ano" name="ano" th:value="${ano}" class="form-control"/>
        </div>

        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Gerar Orçamento</button>
        </div>
    </form>

    <!-- Seções de orçamento -->
    <div th:if="${contaSelecionada != null}">
        <h4 class="mb-4" th:text="'Orçamento da conta: ' + ${contaSelecionada.description}"></h4>

        <!-- Entrada -->
        <section class="mb-5">
            <h5 class="text-success mb-3">Entradas</h5>
            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Categoria</th>
                        <th th:each="mes : ${meses}" th:text="${mes}"></th>
                        <th>Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="categoria : ${categoriasEntrada}">
                        <td th:text="${categoria.name}"></td>
                        <td th:each="valor : ${categoria.valores}" th:text="${valor.getValue()}"></td>
                        <td th:text="${categoria.total}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Saída -->
        <section class="mb-5">
            <h5 class="text-danger mb-3">Saídas</h5>
            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Categoria</th>
                        <th th:each="mes : ${meses}" th:text="${mes}"></th>
                        <th>Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="categoria : ${categoriasSaida}">
                        <td th:text="${categoria.name}"></td>
                        <td th:each="valor : ${categoria.valores}" th:text="${valor.getValue()}"></td>
                        <td th:text="${categoria.total}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Investimento -->
        <section>
            <h5 class="text-primary mb-3">Investimentos</h5>
            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Categoria</th>
                        <th th:each="mes : ${meses}" th:text="${mes}"></th>
                        <th>Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="categoria : ${categoriasInvestimento}">
                        <td th:text="${categoria.name}"></td>
                        <td th:each="valor : ${categoria.valores}" th:text="${valor.getValue()}"></td>
                        <td th:text="${categoria.total}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
