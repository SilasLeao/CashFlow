<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:insert="~{layout/main :: header}"></nav>
<div th:fragment="content" class="container mt-4">
    <h2>Extrato</h2>

    <form method="get" th:action="@{/extrato}" class="row g-3 mb-4">
        <div class="col-md-4">
            <label for="account" class="form-label">Conta</label>
            <select name="accountId" id="account" class="form-select">
                <option th:each="acc : ${filterableAccounts}"
                        th:value="${acc.id}"
                        th:text="${acc.description}"
                        th:selected="${acc.id.equals(selectedAccountId)}">
                </option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="start" class="form-label">Data Inicial</label>
            <input type="date" id="start" name="start" class="form-control" th:value="${start}">
        </div>
        <div class="col-md-3">
            <label for="end" class="form-label">Data Final</label>
            <input type="date" id="end" name="end" class="form-control" th:value="${end}">
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Gerar Extrato</button>
        </div>
    </form>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Data</th>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Comentário</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${extrato}">
            <td th:text="${#dates.format(t.date, 'dd/MM/yyyy')}"></td>
            <td th:text="${t.description}"></td>
            <td th:text="${#numbers.formatCurrency(t.value)}"></td>
            <td>
                <span th:if="${t.comment != null}" th:text="${t.comment.text}"></span>
                <span th:if="${t.comment == null}">-</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
