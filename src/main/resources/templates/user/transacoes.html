<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:insert="~{layout/main :: header}"></nav>

<div th:fragment="content" class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h2>Transações</h2>
        <a th:href="@{/transacoes/criar}" class="btn btn-success">Nova Transação</a>
    </div>
    <hr>

    <form th:action="@{/transacoes}" method="get" class="row g-3 align-items-center mb-4 p-3 bg-light border rounded">
        <div class="col-auto">
            <label for="accountId" class="form-label fw-bold">Filtrar por Conta:</label>
        </div>
        <div class="col-md-6">
            <select id="accountId" name="accountId" class="form-select">
                <option value="">-- Ver Todas --</option>
                <option th:each="account : ${filterableAccounts}"
                        th:value="${account.id}"
                        th:text="${account.description}"
                        th:selected="${account.id.equals(selectedAccountId)}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Filtrar</button>
        </div>
    </form>


    <table class="table table-hover">
        <thead>
        <tr>
            <th>Tipo</th>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Data</th>
            <th>Categoria</th>
            <th>Comentário</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${transacoes}">
            <td>
                <th:block th:switch="${t.category?.nature}">
                    <span th:case="${T(com.example.demo.models.enums.Nature).ENTRADA}"
                          style="color: green; font-weight: bold;">+</span>
                    <span th:case="${T(com.example.demo.models.enums.Nature).SAIDA}"
                          style="color: red; font-weight: bold;">-</span>
                    <span th:case="${T(com.example.demo.models.enums.Nature).INVESTIMENTO}"
                          style="color: blue; font-weight: bold;">-</span>
                    <span th:case="*">?</span>
                </th:block>
            </td>
            <td th:text="${t.description}"></td>
            <td th:text="${#numbers.formatCurrency(t.value)}"></td>
            <td th:text="${#dates.format(t.date, 'dd/MM/yyyy')}"></td>
            <td th:text="${t.category?.name}"></td>
            <td th:text="${t.comment?.text ?: 'Sem comentário'}"></td>
            <td>
                <a th:href="@{/transacoes/{id}/editar(id=${t.id})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/transacoes/{id}/comentario(id=${t.id})}" class="btn btn-sm btn-info">Comentário</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
