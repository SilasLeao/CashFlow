<html xmlns:th="http://www.thymeleaf.org">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<nav th:insert="layout/main :: header"></nav>
<div th:fragment="content">
    <h2>Transações</h2>
    <a th:href="@{/transacoes/criar}" class="btn btn-success mb-3">Nova Transação</a>
    <table class="table">
        <thead>
        <tr>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Movimento</th>
            <th>Comentário</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${transacoes}">
            <td th:text="${t.description}"></td>
            <td th:text="${t.value}"></td>
            <td th:text="${t.movement}"></td>
            <td th:text="${t.comment?.text ?: 'Sem comentário'}"></td>
            <td>
                <a th:href="@{'/transacoes/' + ${t.id} + '/editar'}" class="btn btn-sm btn-warning">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</html>
