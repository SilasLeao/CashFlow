<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<nav th:insert="layout/main :: header"></nav>

<div th:fragment="content" class="container mt-4">
    <h2>Nova Conta</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <p th:text="${errorMessage}"></p>
    </div>
    
    <div th:if="${mensagemSucesso}" class="alert alert-success" role="alert" th:text="${mensagemSucesso}"></div>
    
    <form th:action="@{/contas/nova}" method="post" th:object="${conta}">
        <div class="mb-3">
            <label for="number" class="form-label">Número</label>
            <input type="text" th:field="*{number}" class="form-control" id="number" required />
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Descrição</label>
            <input type="text" th:field="*{description}" class="form-control" id="description" required />
        </div>
        <div class="mb-3">
            <label for="type" class="form-label">Tipo</label>
            <select th:field="*{type}" class="form-control" id="type">
                 <option value="CORRENTE">CORRENTE</option>
                 <option value="CARTAO">CARTAO</option>
            </select>
        </div>
        <div th:if="${user.type == 'ADMIN'}" class="mb-3">
            <label for="usuario" class="form-label">Usuário</label>
            <select name="userId" id="usuario" class="form-select" required>
                <option value="" disabled selected>Selecione o usuário</option>
                <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.name}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
    </form>

    <div class="container mt-4">
    <h2>Contas</h2>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Número</th>
                <th>Descrição</th>
                <th>Tipo</th>
                <th>Validade</th>
                <th>Usuário</th>
                <th th:if="${user.type == 'ADMIN'}">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="conta : ${contas}">
                <td th:text="${conta.number}">Número</td>
                <td th:text="${conta.description}">Descrição</td>
                <td th:text="${conta.type}">Tipo</td>
                <td th:text="${#temporals.format(conta.finishDay, 'dd/MM/yyyy')}">Validade</td>
                <td th:text="${conta.user.name}">Usuário</td>
                <td>
                    <a th:if="${user.type == 'ADMIN'}"
                       th:href="@{'/contas/editar/' + ${conta.id}}"
                       class="btn btn-primary btn-sm">Editar</a>

                    <form th:if="${user.type == 'ADMIN' or conta.user.id == user.id}"
                          th:action="@{'/contas/excluir/' + ${conta.id}}"
                          method="post"
                          style="display:inline;"
                          onsubmit="return confirm('Tem certeza que deseja excluir esta conta?');">
                        <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</div>
</html>
