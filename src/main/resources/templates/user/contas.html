<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .is-invalid {
            border-color: #dc3545;
        }
        .text-danger {
            color: #dc3545;
            font-size: 0.875em;
        }
    </style>
</head>
<body>
    <nav th:insert="~{layout/main :: header}"></nav>

    <div class="container mt-4">
        <button class="btn btn-primary mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#formNovaConta" aria-expanded="false" aria-controls="formNovaConta">
            + Nova Conta
        </button>

        <div class="collapse" id="formNovaConta" th:classappend="${#fields.hasErrors('conta')} ? 'show' : ''">
            <div class="card card-body">
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                    <p th:text="${errorMessage}"></p>
                </div>
                <div th:if="${mensagemSucesso}" class="alert alert-success" role="alert" th:text="${mensagemSucesso}"></div>

                <form th:action="@{/contas/nova}" method="post" th:object="${conta}">
                    
                    <div class="mb-3">
                        <label for="number" class="form-label">Número</label>
                        <input type="text" th:field="*{number}" class="form-control" id="number"
                               th:errorclass="'is-invalid'" />
                        <div th:if="${#fields.hasErrors('number')}" class="text-danger">
                            <p th:errors="*{number}"></p>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Descrição</label>
                        <input type="text" th:field="*{description}" class="form-control" id="description"
                               th:errorclass="'is-invalid'" />
                        <div th:if="${#fields.hasErrors('description')}" class="text-danger">
                            <p th:errors="*{description}"></p>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="type" class="form-label">Tipo</label>
                        <select th:field="*{type}" class="form-select" id="type" th:errorclass="'is-invalid'">
                            <option value="">Selecione...</option>
                            <option th:each="tipo : ${tiposConta}"
                                    th:value="${tipo}"
                                    th:text="${tipo}"></option>
                        </select>
                        <div th:if="${#fields.hasErrors('type')}" class="text-danger">
                            <p th:errors="*{type}"></p>
                        </div>
                    </div>
                    
                    <div th:if="${user.isAdmin()}" class="mb-3">
                        <label for="usuario" class="form-label">Usuário</label>
                        <select name="userId" id="usuario" class="form-select">
                            <option value="" disabled selected>Selecione o usuário</option>
                            <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.name}"></option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success">Salvar</button>
                </form>
            </div>
        </div>

        <div class="container mt-4">
            <h2>Contas</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Número</th>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th>Validade</th>
                        <th>Usuário</th>
                        <th th:if="${user.isAdmin()}">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="conta : ${contas}">
                        <td th:text="${conta.number}">Número</td>
                        <td th:text="${conta.description}">Descrição</td>
                        <td th:text="${conta.type}">Tipo</td>
                        <td th:text="${#temporals.format(conta.finishDay, 'dd/MM/yyyy')}">Validade</td>
                        <td th:text="${conta.user.name}">Usuário</td>
                        <td>
                            <a th:if="${user.isAdmin()}"
                               th:href="@{'/contas/editar/' + ${conta.id}}"
                               class="btn btn-primary btn-sm">Editar</a>
                            
                            <form th:if="${user.isAdmin() or conta.user.id == user.id}"
                                  th:action="@{'/contas/excluir/' + ${conta.id}}"
                                  method="post"
                                  style="display:inline;"
                                  onsubmit="return confirm('Tem certeza que deseja excluir esta conta?');">
                                <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="d-flex mt-3" th:if="${contasTotalPages > 0}">
           </div>
    </div>
</body>
</html>
