<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .is-invalid { border-color: #dc3545; }
        .text-danger { color: #dc3545; font-size: 0.875em; }
    </style>
</head>
<body>

<nav th:insert="~{layout/main :: header}"></nav>

<div class="container py-4">
    <h2>Bem-vindo, <span th:text="${user != null} ? ${user.name} : 'Usuário'"></span>!</h2>

    <div th:if="${user.isAdmin()}" class="mt-5">

        <h4>Categorias do Sistema</h4>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <p th:text="${error}"></p>
        </div>
        <div th:if="${mensagemSucesso}" class="alert alert-success" role="alert" th:text="${mensagemSucesso}"></div>

        <form th:action="@{/dashboard/criarCategoria}" th:object="${category}" method="post" class="row g-3 mb-4 align-items-start">
            <div class="col-md-4">
                <input type="text" th:field="*{name}" class="form-control" placeholder="Nome da Categoria" th:errorclass="'is-invalid'" />
                <div th:if="${#fields.hasErrors('name')}" class="text-danger">
                    <p th:errors="*{name}"></p>
                </div>
            </div>
            <div class="col-md-3">
                <select th:field="*{nature}" class="form-select" th:errorclass="'is-invalid'">
                    <option value="">Selecione a Natureza...</option>
                    <option th:each="n : ${T(com.example.demo.models.enums.Nature).values()}"
                            th:value="${n}" th:text="${n}"></option>
                </select>
                <div th:if="${#fields.hasErrors('nature')}" class="text-danger">
                    <p th:errors="*{nature}"></p>
                </div>
            </div>
            <div class="col-md-2">
                <input type="number" th:field="*{orderIndex}" class="form-control" placeholder="Ordem" th:errorclass="'is-invalid'" />
                <div th:if="${#fields.hasErrors('orderIndex')}" class="text-danger">
                    <p th:errors="*{orderIndex}"></p>
                </div>
            </div>
            <div class="col-md-2">
                <select th:field="*{active}" class="form-select" th:errorclass="'is-invalid'">
                    <option value="">Selecione o Status...</option>
                    <option value="true">Ativa</option>
                    <option value="false">Inativa</option>
                </select>
                <div th:if="${#fields.hasErrors('active')}" class="text-danger">
                    <p th:errors="*{active}"></p>
                </div>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-success w-100">Salvar</button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-bordered table-sm">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Natureza</th>
                    <th>Ordem</th>
                    <th>Ativa</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cat : ${categorias}" th:if="${cat.editing}">
                    <form th:action="@{/dashboard/editarCategoria/{id}(id=${cat.id})}" method="post">
                        <td><input type="text" name="name" th:value="${cat.name}" class="form-control" required/></td>
                        <td>
                            <select name="nature" class="form-select" required>
                                <option value="ENTRADA" th:selected="${cat.nature.name() == 'ENTRADA'}">Entrada</option>
                                <option value="SAIDA" th:selected="${cat.nature.name() == 'SAIDA'}">Saída</option>
                                <option value="INVESTIMENTO" th:selected="${cat.nature.name() == 'INVESTIMENTO'}">Investimento</option>
                            </select>
                        </td>
                        <td><input type="number" name="orderIndex" th:value="${cat.orderIndex}" class="form-control" required/></td>
                        <td>
                            <select name="active" class="form-select" required>
                                <option value="true" th:selected="${cat.active}">Sim</option>
                                <option value="false" th:selected="${!cat.active}">Não</option>
                            </select>
                        </td>
                        <td>
                            <input type="hidden" name="_method" value="put" />
                            <button type="submit" class="btn btn-success btn-sm">Salvar</button>
                            <a th:href="@{/dashboard}" class="btn btn-secondary btn-sm">Cancelar</a>
                        </td>
                    </form>
                </tr>


                <tr th:each="cat : ${categorias}" th:if="${!cat.editing}" th:id="${'cat-' + cat.id}">
                    <td th:text="${cat.name}">Nome</td>
                    <td th:text="${cat.nature}">Natureza</td>
                    <td th:text="${cat.orderIndex}">Ordem</td>
                    <td>
                        <span class="badge bg-success" th:if="${cat.active}">Sim</span>
                        <span class="badge bg-secondary" th:if="${!cat.active}">Não</span>
                    </td>
                    <td>
                        <form th:action="@{/dashboard/editarCategoria/{id}(id=${cat.id})}" method="get" class="d-inline">
                            <button type="submit" class="btn btn-primary btn-sm">Editar</button>
                        </form>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-2">
            <div>
                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${categoriasCurrentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/dashboard(pageCategories=${categoriasCurrentPage - 1}, pageUsers=${usuariosCurrentPage})}"><-</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, categoriasTotalPages - 1)}"
                            th:classappend="${i == categoriasCurrentPage} ? 'active'">
                            <a class="page-link" th:href="@{/dashboard(pageCategories=${i}, pageUsers=${usuariosCurrentPage})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${categoriasCurrentPage + 1 >= categoriasTotalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/dashboard(pageCategories=${categoriasCurrentPage + 1}, pageUsers=${usuariosCurrentPage})}">-></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <h5 class="mt-5">Cadastrar Novo Correntista</h5>
        
        <div th:if="${mensagemErro}" class="alert alert-danger" role="alert" th:text="${mensagemErro}"></div>


        <form th:action="@{/usuarios/cadastrar}" th:object="${novoUsuario}" method="post" class="row g-3">
            <div class="col-md-3">
                <input type="text" th:field="*{name}" class="form-control" placeholder="Nome" th:errorclass="'is-invalid'"/>
                <div th:if="${#fields.hasErrors('name')}" class="text-danger">
                    <p th:errors="*{name}"></p>
                </div>
            </div>
            <div class="col-md-3">
                <input type="text" th:field="*{login}" class="form-control" placeholder="Login" th:errorclass="'is-invalid'"/>
                <div th:if="${#fields.hasErrors('login')}" class="text-danger">
                    <p th:errors="*{login}"></p>
                </div>
            </div>
            <div class="col-md-2">
                <input type="password" th:field="*{password}" class="form-control" placeholder="Senha" th:errorclass="'is-invalid'"/>
                <div th:if="${#fields.hasErrors('password')}" class="text-danger">
                    <p th:errors="*{password}"></p>
                </div>
            </div>
            <div class="col-md-2">
                <select th:field="*{type}" class="form-select" th:errorclass="'is-invalid'">
                    <option value="">Selecione...</option>
                    <option value="NORMAL">NORMAL</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
                <div th:if="${#fields.hasErrors('type')}" class="text-danger">
                    <p th:errors="*{type}"></p>
                </div>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
            </div>
        </form>
        

        <h4 class="mt-5">Correntistas</h4>
        <div class="table-responsive">
            <table class="table table-sm table-hover">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Login</th>
                    <th>Tipo</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.name}">Fulano</td>
                    <td th:text="${u.login}">fulano</td>
                    <td th:text="${u.type}">NORMAL</td>
                    <td>
                        <span class="badge bg-success" th:if="${!u.blocked}">Ativo</span>
                        <span class="badge bg-danger" th:if="${u.blocked}">Bloqueado</span>
                    </td>
                    <td>
                        <div th:if="${u.type != 'ADMIN'}">
                            <form th:action="@{'/usuarios/' + ${u.id} + '/editar'}" method="get" class="d-inline">
                                <button class="btn btn-primary btn-sm">Editar</button>
                            </form>
                            <form th:action="@{'/usuarios/' + ${u.id} + '/bloquear'}" method="post" th:if="${!u.blocked}" class="d-inline">
                                <button class="btn btn-warning btn-sm">Bloquear</button>
                            </form>
                            <form th:action="@{'/usuarios/' + ${u.id} + '/excluir'}" method="post" class="d-inline">
                                <button class="btn btn-danger btn-sm" onclick="return confirm('Tem certeza que deseja excluir este usuário?')">Excluir</button>
                            </form>
                        </div>
                        <form th:action="@{'/usuarios/' + ${u.id} + '/desbloquear'}" method="post" th:if="${u.blocked}" class="d-inline">
                            <button class="btn btn-success btn-sm">Desbloquear</button>
                        </form>
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-2">
            <div>
                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${usuariosCurrentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/dashboard(pageUsers=${usuariosCurrentPage - 1}, pageCategories=${categoriasCurrentPage})}"><-</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, usuariosTotalPages - 1)}"
                            th:classappend="${i == usuariosCurrentPage} ? 'active'">
                            <a class="page-link" th:href="@{/dashboard(pageUsers=${i}, pageCategories=${categoriasCurrentPage})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${usuariosCurrentPage + 1 >= usuariosTotalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/dashboard(pageUsers=${usuariosCurrentPage + 1}, pageCategories=${categoriasCurrentPage})}">-></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
</body>
</html>
